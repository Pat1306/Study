<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biology Quiz (Mobile)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            background-color: #f8fafc;
        }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        /* ซ่อน Scrollbar สำหรับ Chrome, Safari และ Opera */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const quizData = [
            { id: 1, question: 'ในระยะ Prophase I ระยะย่อยใดที่เกิด Synapsis และสร้าง Synaptonemal complex?', options: ['Leptotene', 'Zygotene', 'Pachytene', 'Diplotene', 'Diakinesis'], correctAnswer: 1, explanation: 'Zygotene คือระยะที่โครโมโซมคู่เหมือนเริ่มเข้าคู่กัน (Synapsis)' },
            { id: 2, question: 'เอนไซม์ใดทำหน้าที่ตัด Cohesin เพื่อให้ Sister chromatids แยกจากกันใน Anaphase?', options: ['Securin', 'CDK1', 'Separase', 'Cyclin B', 'Topoisomerase'], correctAnswer: 2, explanation: 'Separase เป็นเอนไซม์ที่ทำหน้าที่ย่อยสลาย Cohesin เพื่อให้โครมาทิดแยกออกจากกัน' },
            { id: 3, question: 'เซลล์ไข่ (Secondary oocyte) ในมนุษย์จะหยุดแบ่งตัว (Arrest) ที่ระยะใดก่อนการปฏิสนธิ?', options: ['Prophase I', 'Metaphase I', 'Anaphase I', 'Metaphase II', 'Anaphase II'], correctAnswer: 3, explanation: 'เซลล์ไข่จะหยุดพักที่ Metaphase II จนกว่าจะมีอสุจิเข้ามาปฏิสนธิ' },
            { id: 4, question: 'Checkpoint ใดที่ทำหน้าที่ตรวจสอบความสมบูรณ์ของการจำลอง DNA?', options: ['G1 Checkpoint', 'S Checkpoint', 'G2 Checkpoint', 'M Checkpoint', 'G0 Checkpoint'], correctAnswer: 2, explanation: 'G2 Checkpoint ตรวจสอบความถูกต้องและสมบูรณ์ของ DNA ก่อนเข้าสู่กระบวนการแบ่งนิวเคลียส' },
            { id: 5, question: 'พืชมีการแบ่งไซโทพลาซึมโดยการสร้างสิ่งใด?', options: ['Cleavage furrow', 'Contractile ring', 'Cell plate', 'Aster fiber', 'Centrosome'], correctAnswer: 2, explanation: 'เซลล์พืชสร้าง Cell plate จากถุงเวสิเคิลของ Golgi complex เนื่องจากมีผนังเซลล์ที่แข็งแรงคอดกิ่วไม่ได้' }
            // สามารถเพิ่มข้อมูลจนครบ 50 ข้อได้ที่นี่
        ];

        // จำลองข้อมูลเพิ่มให้ครบ 50 ข้อ
        for(let i=6; i<=50; i++) {
            quizData.push({
                id: i,
                question: `[โจทย์ สอวน. ข้อที่ ${i}] กระบวนการทางชีววิทยาระดับเซลล์ใดสำคัญที่สุดในระยะนี้?`,
                options: ['การสังเคราะห์โปรตีน', 'การจำลอง DNA', 'การสลาย ATP', 'การรวมตัวของไมโครทิวบูล', 'การเกิด Recombination'],
                correctAnswer: Math.floor(Math.random() * 5),
                explanation: `คำอธิบายข้อที่ ${i}: เจาะลึกเนื้อหาชีววิทยาโอลิมปิกในส่วนของกลไกการควบคุมวัฏจักรเซลล์`
            });
        }

        const App = () => {
            const [page, setPage] = useState('menu');
            const [currentIdx, setCurrentIdx] = useState(0);
            const [score, setScore] = useState(0);
            const [selected, setSelected] = useState(null);
            const [showResult, setShowResult] = useState(false);

            const startQuiz = () => {
                setCurrentIdx(0);
                setScore(0);
                setSelected(null);
                setShowResult(false);
                setPage('quiz');
            };

            const handleSubmit = () => {
                if (selected === null) return;
                setShowResult(true);
                if (selected === quizData[currentIdx].correctAnswer) setScore(score + 1);
            };

            const nextQuestion = () => {
                if (currentIdx < quizData.length - 1) {
                    setCurrentIdx(currentIdx + 1);
                    setSelected(null);
                    setShowResult(false);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    setPage('summary');
                }
            };

            if (page === 'menu') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-gradient-to-br from-blue-600 to-indigo-800 text-white">
                        <div className="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center mb-6 backdrop-blur-md">
                            <span className="text-4xl">🧬</span>
                        </div>
                        <h1 className="text-3xl font-extrabold mb-2">ชีววิทยา</h1>
                        <p className="text-blue-100 mb-10 text-center opacity-90">แบบทดสอบเนื้อหาการแบ่งเซลล์ระดับสูง (50 ข้อ)</p>
                        
                        <div className="w-full max-w-sm space-y-4">
                            <button onClick={startQuiz} className="w-full py-4 bg-white text-blue-700 rounded-2xl font-bold text-lg shadow-xl active:scale-95 transition-all">
                               เริ่มทำข้อสอบ
                            </button>
                            <button className="w-full py-4 bg-blue-700/50 text-blue-200 rounded-2xl font-bold text-lg border border-blue-400/30 opacity-50 cursor-not-allowed">
                                หมวดอื่นๆ (เร็วๆ นี้)
                            </button>
                        </div>
                    </div>
                );
            }

            if (page === 'summary') {
                return (
                    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-6 text-slate-800">
                        <div className="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 text-center border-t-8 border-blue-600">
                            <h2 className="text-2xl font-bold mb-6">สรุปผลการทดสอบ</h2>
                            <div className="relative inline-block mb-6">
                                <svg className="w-32 h-32 transform -rotate-90">
                                    <circle cx="64" cy="64" r="58" stroke="#e2e8f0" strokeWidth="8" fill="transparent" />
                                    <circle cx="64" cy="64" r="58" stroke="#2563eb" strokeWidth="8" fill="transparent" 
                                        strokeDasharray={364.4} strokeDashoffset={364.4 - (364.4 * score / quizData.length)}
                                        strokeLinecap="round" />
                                </svg>
                                <div className="absolute inset-0 flex flex-col items-center justify-center">
                                    <span className="text-3xl font-black">{score}</span>
                                    <span className="text-xs text-slate-400">เต็ม {quizData.length}</span>
                                </div>
                            </div>
                            <p className="text-slate-500 mb-8 px-4">
                                {score > 40 ? "สุดยอด! ความรู้ระดับตัวแทนศูนย์" : score > 25 ? "เกณฑ์ดี! ฝึกฝนอีกนิดจะเก่งมาก" : "พยายามต่อไปนะ ทบทวนเนื้อหาเพิ่มอีกนิด"}
                            </p>
                            <button onClick={() => setPage('menu')} className="w-full py-4 bg-blue-600 text-white rounded-2xl font-bold shadow-lg">
                                กลับหน้าหลัก
                            </button>
                        </div>
                    </div>
                );
            }

            const q = quizData[currentIdx];
            return (
                <div className="min-h-screen flex flex-col pb-20">
                    {/* Header bar */}
                    <div className="sticky top-0 z-10 glass-card border-b border-slate-200 px-6 py-4 flex items-center justify-between">
                        <div className="flex flex-col">
                            <span className="text-[10px] uppercase tracking-wider font-bold text-blue-600">Biology Quiz</span>
                            <span className="text-sm font-bold text-slate-700">ข้อ {currentIdx + 1} จาก {quizData.length}</span>
                        </div>
                        <div className="w-24 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                            <div className="h-full bg-blue-600 transition-all duration-300" style={{width: `${((currentIdx+1)/quizData.length)*100}%`}}></div>
                        </div>
                    </div>

                    <div className="px-6 py-8 flex-1 max-w-2xl mx-auto w-full">
                        <h2 className="text-xl font-bold text-slate-800 leading-relaxed mb-8">
                            {q.question}
                        </h2>

                        <div className="space-y-3">
                            {q.options.map((opt, i) => {
                                let style = "w-full p-5 rounded-2xl text-left font-medium border-2 transition-all duration-200 active:scale-[0.98] ";
                                if (showResult) {
                                    if (i === q.correctAnswer) style += "bg-emerald-50 border-emerald-500 text-emerald-700 shadow-sm";
                                    else if (selected === i) style += "bg-rose-50 border-rose-500 text-rose-700";
                                    else style += "bg-white border-slate-100 text-slate-300 opacity-60";
                                } else {
                                    style += selected === i ? "bg-blue-50 border-blue-600 text-blue-700 shadow-md" : "bg-white border-white shadow-sm text-slate-600";
                                }

                                return (
                                    <button key={i} disabled={showResult} onClick={() => setSelected(i)} className={style}>
                                        <div className="flex items-center">
                                            <span className={`w-8 h-8 rounded-full flex items-center justify-center mr-3 text-sm font-bold ${selected === i ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-500'}`}>
                                                {String.fromCharCode(65 + i)}
                                            </span>
                                            <span className="flex-1">{opt}</span>
                                        </div>
                                    </button>
                                );
                            })}
                        </div>

                        {showResult && (
                            <div className="mt-8 animate-in fade-in slide-in-from-bottom-4 duration-500">
                                <div className="p-6 bg-slate-800 text-white rounded-3xl shadow-xl">
                                    <h4 className="flex items-center text-blue-400 font-bold mb-2">
                                        <span className="mr-2">💡</span> คำอธิบาย
                                    </h4>
                                    <p className="text-sm leading-relaxed text-slate-300">{q.explanation}</p>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Bottom Navigation */}
                    <div className="fixed bottom-0 left-0 right-0 p-4 bg-white/80 backdrop-blur-lg border-t border-slate-100 flex justify-center safe-bottom">
                        {!showResult ? (
                            <button onClick={handleSubmit} disabled={selected === null} className={`w-full max-w-sm py-4 rounded-2xl font-bold text-white transition-all ${selected === null ? 'bg-slate-300' : 'bg-blue-600 shadow-lg shadow-blue-200'}`}>
                                ตรวจคำตอบ
                            </button>
                        ) : (
                            <button onClick={nextQuestion} className="w-full max-w-sm py-4 bg-slate-900 text-white rounded-2xl font-bold shadow-lg flex items-center justify-center gap-2">
                                {currentIdx < quizData.length - 1 ? "ข้อถัดไป" : "ดูผลคะแนน"} <span>→</span>
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
